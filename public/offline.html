<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#244f3c" />
  <title>Ngoại tuyến — GAERU Soft</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #f8faf9;
      --card: #ffffff;
      --primary: #244f3c;
      --primary-hover: #1b3d2e;
      --text: #27382e;
      --muted: #5a6e63;
      --border: #e2e8e4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.25rem 1.75rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      background: #eef4f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text);
    }
    p {
      font-size: 0.9375rem;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .note {
      font-size: 0.8125rem;
      color: var(--muted);
      background: #f3f6f4;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 160px;
      padding: 0.75rem 1.75rem;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
      touch-action: manipulation;
    }
    .retry-btn:hover, .retry-btn:focus-visible {
      background-color: var(--primary-hover);
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="offline-card" role="main">
    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Không có kết nối mạng</h1>
    <p>Thiết bị hiện đang ngoại tuyến hoặc mạng chập chờn. Vui lòng kiểm tra lại kết nối Wi-Fi hoặc dữ liệu di động (4G/5G).</p>
    <div class="note">
      <strong>Lưu ý:</strong> Giỏ hàng nháp và các thao tác đang chờ trên trình duyệt của bạn vẫn được bảo lưu an toàn.
    </div>
    <button class="retry-btn" onclick="window.location.reload()" type="button">Thử kết nối lại</button>
  </main>
</body>
</html>
